plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.afnon.home'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.afnon.home'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Offline prayer-time calculation (no network, no transitive dependencies).
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
}
