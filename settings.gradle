pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Only for :installer's ADB library and its SPAKE2 dependency.
        maven {
            url 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\.MuntashirAkon.*' }
        }
    }
}
rootProject.name = "IslamicTVLauncher"
include ':app'
project(':app').projectDir = file('platforms/android-tv')
include ':installer'
includeBuild('shared/core')
