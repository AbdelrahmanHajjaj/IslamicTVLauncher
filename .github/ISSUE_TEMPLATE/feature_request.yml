name: Idea · فكرة
description: Suggest something for household users of Islamic TV Launcher.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Islamic TV Launcher serves households and must run on low-memory TVs.
        No feeds, ads, telemetry or sign-ins. Radio and manual online prayer comparison are optional.
        Name the affected platform and shared behavior; companion apps remain deferred.
        For a ruling where scholars differ, describe the options rather than one answer.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What it would do, and who it helps.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you do today without it.
  - type: textarea
    id: remote
    attributes:
      label: With the remote
      description: How it would work with only the D-pad, OK and Back.
