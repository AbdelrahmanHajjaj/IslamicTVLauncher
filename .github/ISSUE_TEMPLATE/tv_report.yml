name: My TV · تلفازي
description: Report Islamic TV Launcher behavior on an Android TV or LG webOS device.
labels: [tv-report]
body:
  - type: markdown
    attributes:
      value: |
        Report your actual device and build; behavior differs between Android and LG.
        Android Home/remote services do not apply to LG. Mark unavailable features N/A.
        Leave out your Wi-Fi name, IP addresses and serial numbers.
  - type: input
    id: tv
    attributes:
      label: Platform, TV model, OS/firmware and RAM if known
      placeholder: LG LF6300, webOS 2.2; or TCL 50C641K, Android 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Islamic TV Launcher version or source commit
      placeholder: "LG 0.2.20"
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What you checked (leave untested items unchecked)
      options:
        - label: In-place update preserves settings
        - label: Arabic/English layout and remote navigation
        - label: Adhan and normal picture/sound restoration
        - label: Enabled startup works after a watched reboot
        - label: Android default Home and remote buttons service
        - label: LG embedded input and return from other apps
        - label: Radio or screensaver (describe which below)
  - type: textarea
    id: buttons
    attributes:
      label: Remote buttons
      description: Which navigation/special buttons work and how focus returns. Android ADB key diagnostics do not apply to LG.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What didn't work, screenshots, or your brand's way to turn the panel off while sound plays.
