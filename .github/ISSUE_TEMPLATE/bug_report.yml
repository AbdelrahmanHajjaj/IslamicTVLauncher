name: Bug · خلل
description: Something on the TV doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Arabic or English, either is fine. يمكنك الكتابة بالعربية أو الإنجليزية.
        Leave out your Wi-Fi name, IP addresses and serial numbers, in text and in screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings with the remote's Settings button
        2. ...
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: Platform, TV model and OS/firmware
      placeholder: LG LF6300, webOS 2.2; or TCL 50C641K, Android 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Islamic TV Launcher version
      description: "App version or source commit. Say if this is a physical TV, emulator or browser preview."
      placeholder: "LG 0.2.20, physical TV"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [العربية, English, Both]
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: "Optional sanitized evidence. Label browser/emulator/TV captures; keep device addresses, keys and private content out. ADB logs apply only to Android."
      render: text
