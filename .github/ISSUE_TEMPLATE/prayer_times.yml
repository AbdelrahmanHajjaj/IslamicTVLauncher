name: Prayer times or city · مواقيت الصلاة أو مدينة
description: A time is off, or your city is missing.
labels: [prayer-times]
body:
  - type: markdown
    attributes:
      value: |
        A wrong time matters more than any feature, thank you. شكرًا، خطأ في وقت الصلاة أهم من أي ميزة.
  - type: dropdown
    id: kind
    attributes:
      label: What is it
      options:
        - A time is wrong
        - Add my city
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City and country
      placeholder: Alexandria, Egypt
    validations:
      required: true
  - type: input
    id: method
    attributes:
      label: Calculation method
      description: The one your local religious authority uses, if you know it.
      placeholder: Egyptian General Authority of Survey
  - type: textarea
    id: compare
    attributes:
      label: Launcher times against a reference
      description: For one date, give six times and a source link. Include platform/app version, timezone, Asr school and saved offsets; identify an official timetable where available.
      placeholder: |
        Date: 2026-10-22
        Fajr  launcher 04:31  official 04:30
        ...
        Source: https://...
    validations:
      required: true
