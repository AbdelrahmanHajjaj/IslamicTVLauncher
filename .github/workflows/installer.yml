# Builds the phone installer (installer/) and keeps the APK as a workflow artifact.
name: Installer

on:
  push:
    branches: [main]
    paths: ['installer/**', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/installer.yml']
  pull_request:
    paths: ['installer/**', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/installer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :installer:assembleDebug --no-daemon --stacktrace
          cp installer/build/outputs/apk/debug/installer-debug.apk afnon-installer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: afnon-installer
          path: afnon-installer.apk

  # Every screen in Arabic and English on an emulator, retained as CI artifacts.
  screenshots:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: afnon-installer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash installer/tools/shots.sh afnon-installer.apk shots
      - uses: actions/upload-artifact@v4
        with:
          name: installer-screenshots
          path: shots/*.png
