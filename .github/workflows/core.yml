name: Shared core

on:
  push:
    branches: [main]
    paths: ['shared/core/**', 'kotlin-js-store/**', 'settings.gradle', 'build.gradle', 'gradle.properties', 'gradle/**', 'webos/package*.json', '.github/workflows/core.yml']
  pull_request:
    paths: ['shared/core/**', 'kotlin-js-store/**', 'settings.gradle', 'build.gradle', 'gradle.properties', 'gradle/**', 'webos/package*.json', '.github/workflows/core.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix webos ci --ignore-scripts
      - run: chmod +x gradlew && ./gradlew :core:check --no-daemon --stacktrace
