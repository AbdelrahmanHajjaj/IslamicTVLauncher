name: Shared core

on:
  push:
    branches: [main]
    paths: ['shared/core/**', 'gradle/**', 'gradlew*', '.github/workflows/core.yml']
  pull_request:
    paths: ['shared/core/**', 'gradle/**', 'gradlew*', '.github/workflows/core.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shared/core/package-lock.json
      - run: npm --prefix shared/core ci --ignore-scripts
      - run: sh ./gradlew -p shared/core check jvmJar --no-daemon --stacktrace
