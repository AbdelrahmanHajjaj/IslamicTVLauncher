<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Afnon Mihrab · Screensaver</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&amp;family=Amiri:wght@400;700&amp;family=Marcellus&amp;display=swap">
<style>
body{margin:0}
a{color:#D8B46A}a:hover{color:#F0D79C}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000000; color: #A69F90; font-family: 'Alexandria', sans-serif">
  <div style="position: absolute; left: 1140px; top: 250px; width: 440px; height: 580px">
    <svg aria-hidden="true" width="440" height="580" viewBox="0 0 440 580" style="position: absolute; inset: 0">
      <path d="M2 580 L2 230 C2 120 100 52 220 2 C340 52 438 120 438 230 L438 580" fill="none" stroke="rgba(216,180,106,.35)" stroke-width="2"></path>
    </svg>
    <div style="position: absolute; left: 20px; right: 20px; top: 190px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
      <div style="font-family: {{fd}}; font-size: 128px; line-height: 1; font-weight: 400">{{clock}}</div>
      <div style="font-size: 24px; color: #7D7769">{{date}}</div>
      <div style="width: 80px; height: 1px; background: rgba(216,180,106,.35); margin: 18px 0"></div>
      <div style="font-size: 28px; color: #B8A578">{{next}}</div>
      <div style="font-size: 24px; color: #7D7769">{{left}}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["ar","en"],"default":"ar"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
  var ar = (this.props.locale ?? 'ar') === 'ar';
  var d = function (s) { return ar ? String(s).replace(/[0-9]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'[+c]; }) : String(s); };
  return {
    dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en',
    fd: ar ? "'Amiri', serif" : "'Marcellus', serif",
    clock: d('14:21'),
    date: d(ar ? 'الثلاثاء · 9 جمادى الأولى' : 'Tuesday · 9 Jumada al-Ula'),
    next: d(ar ? 'العصر 14:48' : 'Asr 14:48'),
    left: d(ar ? 'بعد 27 دقيقة' : 'in 27 min')
  };
}
}
</script>
</body>
</html>
