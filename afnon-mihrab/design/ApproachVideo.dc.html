<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Afnon Mihrab · Prayer approaching over video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&amp;family=Amiri:wght@400;700&amp;family=Marcellus&amp;display=swap">
<style>
body{margin:0}
a{color:#D8B46A}a:hover{color:#F0D79C}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #3E5C76; color: #EFE7D6; font-family: 'Alexandria', sans-serif">

  <svg aria-hidden="true" width="1920" height="1080" viewBox="0 0 1920 1080" style="position: absolute; inset: 0">
    <rect width="1920" height="620" fill="#7FA3C0"></rect>
    <circle cx="1380" cy="300" r="90" fill="#F4E3B5"></circle>
    <path d="M0 640 C300 520 560 560 820 620 C1100 690 1400 560 1920 600 L1920 1080 L0 1080 Z" fill="#C79A5B"></path>
    <path d="M0 800 C380 700 700 760 1000 820 C1300 880 1600 780 1920 800 L1920 1080 L0 1080 Z" fill="#A8773F"></path>
  </svg>
  <div style="position: absolute; inset-inline-start: 96px; top: 64px; padding: 10px 18px; border-radius: 10px; background: rgba(0,0,0,.45); font-size: 22px; color: #EFE7D6">{{t.placeholder}}</div>

  <div aria-hidden="true" style="position: absolute; left: 96px; right: 96px; bottom: 64px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.3)">
    <div style="width: 38%; height: 8px; border-radius: 4px; background: #FFFFFF"></div>
  </div>

  <div role="status" aria-live="polite" style="position: absolute; inset-inline-end: 96px; top: 56px; width: 640px; box-sizing: border-box; border-radius: 24px; background: #0C1B33; color: #EFE7D6; padding: 24px 28px 0; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 0 0 2px #D8B46A">
    <div style="display: flex; align-items: center; gap: 20px">
      <svg width="56" height="72" viewBox="0 0 56 72" aria-hidden="true"><path d="M4 70V30C4 16 14 9 28 2c14 7 24 14 24 28v40z" fill="#12264A" stroke="#D8B46A" stroke-width="3"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
        <div style="font-size: 20px; letter-spacing: {{ls}}; color: #9FB0CC">{{t.label}}</div>
        <div style="font-family: {{fd}}; font-weight: {{fw}}; font-size: 44px; line-height: 1.1">{{t.title}}</div>
        <div style="font-size: 22px; color: #9FB0CC">{{t.sub}}</div>
      </div>
    </div>
    <div aria-hidden="true" style="margin: 18px -28px 0; height: 6px; border-radius: 0 0 24px 24px; background: rgba(216,180,106,.25); overflow: hidden">
      <div style="width: 60%; height: 6px; background: #D8B46A"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["ar","en"],"default":"ar"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
  var ar = (this.props.locale ?? 'ar') === 'ar';
  var t = ar ? {
    placeholder: '[فيديو قيد التشغيل في تطبيق آخر]', label: 'اقتربت الصلاة',
    title: 'العصر بعد ١٣ دقيقة', sub: 'الأذان ١٤:٤٨ · يختفي خلال ١٢ ث · اضغط مطولًا على الرئيسية لفتح أفنان'
  } : {
    placeholder: '[Video playing in another app]', label: 'PRAYER APPROACHING',
    title: 'Asr in 13 minutes', sub: 'Adhan 14:48 · hides in 12 s · hold Home to open Afnon'
  };
  return {
    dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en', t: t,
    fd: ar ? "'Amiri', serif" : "'Marcellus', serif", fw: ar ? 700 : 400, ls: ar ? '0' : '.2em'
  };
}
}
</script>
</body>
</html>
