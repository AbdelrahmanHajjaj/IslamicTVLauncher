<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Afnon Mihrab · Prayer settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&amp;family=Amiri:wght@400;700&amp;family=Marcellus&amp;display=swap">
<style>
body{margin:0}
a{color:#D8B46A}a:hover{color:#F0D79C}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0C1B33; color: #EFE7D6; font-family: 'Alexandria', sans-serif">

  <div style="position: absolute; inset-inline-start: 0; top: 0; width: 560px; height: 1080px; box-sizing: border-box; background: #0A1730; padding-block: 56px; padding-inline: 96px 40px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 28px">
      <svg width="36" height="46" viewBox="0 0 56 72" aria-hidden="true"><path d="M4 70V30C4 16 14 9 28 2c14 7 24 14 24 28v40z" fill="none" stroke="#D8B46A" stroke-width="3"></path></svg>
      <h1 style="margin: 0; font-family: {{fd}}; font-weight: {{fw}}; font-size: 52px; line-height: 1.1">{{t.title}}</h1>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <a href="#" style="height: 76px; box-sizing: border-box; border-radius: 14px; padding-inline: 24px; display: flex; align-items: center; font-size: 26px; text-decoration: none; {{n.style}}">{{n.label}}</a>
    </sc-for>
    <div style="margin-top: auto; border-radius: 16px; background: #12264A; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 20px; color: #9FB0CC">{{t.preview}}</span>
      <span style="font-family: {{fd}}; font-size: 36px; color: #D8B46A">{{previewVal}}</span>
    </div>
  </div>

  <div style="position: absolute; inset-inline-start: 640px; top: 56px; width: 1184px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 22px; letter-spacing: {{ls}}; color: #9FB0CC; margin-bottom: 14px">{{t.section}}</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
      <div style="min-height: 88px; box-sizing: border-box; border-radius: 16px; padding-inline: 28px; padding-block: 10px; display: flex; align-items: center; gap: 24px; {{r.style}}">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 26px; font-weight: 500">{{r.label}}</span>
          <span style="font-size: 20px; opacity: .75">{{r.help}}</span>
        </span>
        <sc-if value="{{r.isValue}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 24px; display: flex; align-items: center; gap: 12px">{{r.value}}
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{flip}}"><path d="M9 5l7 7-7 7"></path></svg>
          </span>
        </sc-if>
        <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{ false }}">
          <span role="radiogroup" aria-label="{{r.label}}" style="display: flex; gap: 6px; padding: 6px; border-radius: 30px; background: {{r.segBg}}">
            <sc-for list="{{r.segs}}" as="s" hint-placeholder-count="2">
              <span role="radio" aria-checked="{{s.checked}}" style="height: 52px; padding: 0 24px; border-radius: 26px; display: flex; align-items: center; font-size: 22px; {{s.style}}">{{s.label}}</span>
            </sc-for>
          </span>
        </sc-if>
        <sc-if value="{{r.isStep}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; align-items: center; gap: 18px; font-size: 26px">
            <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #1A3360; display: flex; align-items: center; justify-content: center">−</span>
            <span style="min-width: 150px; text-align: center">{{r.value}}</span>
            <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #1A3360; display: flex; align-items: center; justify-content: center">+</span>
          </span>
        </sc-if>
        <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}">
          <span role="switch" aria-checked="true" aria-label="{{r.label}}" style="width: 88px; height: 48px; border-radius: 24px; background: #D8B46A; position: relative; display: block">
            <span style="position: absolute; top: 6px; inset-inline-end: 6px; width: 36px; height: 36px; border-radius: 18px; background: #0C1B33"></span>
          </span>
        </sc-if>
      </div>
    </sc-for>
    <div style="display: flex; gap: 36px; font-size: 22px; color: #9FB0CC; margin-top: 10px">
      <sc-for list="{{t.hints}}" as="h" hint-placeholder-count="3"><span>{{h}}</span></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["ar","en"],"default":"ar"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
  var ar = (this.props.locale ?? 'ar') === 'ar';
  var d = function (s) { return ar ? String(s).replace(/[0-9]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'[+c]; }) : String(s); };
  var t = ar ? {
    title: 'الإعدادات', section: 'مواقيت الصلاة', preview: 'العصر اليوم بهذه الإعدادات',
    nav: ['مواقيت الصلاة', 'التنبيهات والأذان', 'العرض واللغة', 'الشبكة · Home-WiFi', 'إعدادات الجهاز'],
    hints: ['▲▼  تنقل', '◀▶  تغيير القيمة', 'رجوع  حفظ وخروج']
  } : {
    title: 'Settings', section: 'PRAYER TIMES', preview: 'Asr today with these settings',
    nav: ['Prayer times', 'Reminders & adhan', 'Display & language', 'Network · Home-WiFi', 'Device settings'],
    hints: ['▲▼  Move', '◀▶  Change value', 'Back  Save & exit']
  };
  var focusRow = 2;
  var R = ar ? [
    { k: 'value', label: 'الموقع', help: '30.04° ش · 31.24° ق · يُحدَّد يدويًا أو بالشبكة', value: 'القاهرة، مصر' },
    { k: 'value', label: 'طريقة الحساب', help: 'زاوية الفجر 19.5° · العشاء 17.5°', value: 'الهيئة المصرية العامة للمساحة' },
    { k: 'seg', label: 'مذهب العصر', help: 'يغيّر وقت العصر فقط', segs: ['الجمهور', 'الحنفي'], sel: 0 },
    { k: 'step', label: 'تعديل التاريخ الهجري', help: 'اليوم: 9 جمادى الأولى 1448', value: '0 يوم' },
    { k: 'seg', label: 'التنبيه قبل الصلاة', help: 'على الرئيسية وفوق الفيديو', segs: ['10 د', '15 د', 'إيقاف'], sel: 1 },
    { k: 'toggle', label: 'الأذان', help: 'يُشغَّل عند دخول الوقت · يمكن إيقافه لكل صلاة', value: '' },
    { k: 'seg', label: 'الأرقام', help: '', segs: ['0123', '٠١٢٣'], sel: 1 },
    { k: 'seg', label: 'الساعة', help: '', segs: ['12 س', '24 س'], sel: 1 },
    { k: 'seg', label: 'اللغة', help: '', segs: ['العربية', 'English'], sel: 0 }
  ] : [
    { k: 'value', label: 'Location', help: '30.04° N · 31.24° E · set by hand or from the network', value: 'Cairo, Egypt' },
    { k: 'value', label: 'Calculation method', help: 'Fajr angle 19.5° · Isha 17.5°', value: 'Egyptian General Authority of Survey' },
    { k: 'seg', label: 'Asr school', help: 'Only changes the Asr time', segs: ['Standard', 'Hanafi'], sel: 0 },
    { k: 'step', label: 'Hijri date adjustment', help: 'Today: 9 Jumada al-Ula 1448', value: '0 days' },
    { k: 'seg', label: 'Remind me before prayer', help: 'On Home and over video', segs: ['10 min', '15 min', 'Off'], sel: 1 },
    { k: 'toggle', label: 'Adhan', help: 'Plays when the time begins · can be muted per prayer', value: '' },
    { k: 'seg', label: 'Digits', help: '', segs: ['0123', '٠١٢٣'], sel: 0 },
    { k: 'seg', label: 'Clock', help: '', segs: ['12 h', '24 h'], sel: 1 },
    { k: 'seg', label: 'Language', help: '', segs: ['العربية', 'English'], sel: 1 }
  ];
  var rows = R.map(function (r, i) {
    var f = i === focusRow;
    var digitRow = r.segs && r.segs[0] === '0123';
    return {
      label: r.label, help: d(r.help), value: d(r.value || ''),
      isValue: r.k === 'value', isSeg: r.k === 'seg', isStep: r.k === 'step', isToggle: r.k === 'toggle',
      style: f ? 'background: #D8B46A; color: #0C1B33; outline: 4px solid #EFE7D6; outline-offset: 6px;' : 'background: #12264A; color: #EFE7D6;',
      segBg: f ? 'rgba(12,27,51,.15)' : '#0C1B33',
      segs: (r.segs || []).map(function (s, j) {
        var on = j === r.sel;
        return {
          label: digitRow ? s : d(s), checked: on ? 'true' : 'false',
          style: on ? (f ? 'background: #0C1B33; color: #EFE7D6; box-shadow: 0 0 0 3px #EFE7D6;' : 'background: #EFE7D6; color: #0C1B33;') : (f ? 'color: #0C1B33;' : 'color: #9FB0CC;')
        };
      })
    };
  });
  var nav = t.nav.map(function (n, i) {
    return { label: n, style: i === 0 ? 'background: #12264A; color: #EFE7D6; box-shadow: inset 0 0 0 2px #D8B46A;' : 'color: #9FB0CC;' };
  });
  return {
    dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en', t: t, rows: rows, nav: nav,
    fd: ar ? "'Amiri', serif" : "'Marcellus', serif", fw: ar ? 700 : 400, ls: ar ? '0' : '.2em',
    flip: ar ? 'scaleX(-1)' : 'none', previewVal: d('14:48')
  };
}
}
</script>
</body>
</html>
